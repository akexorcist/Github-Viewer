name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      skip_real_tests:
        description: "Skip real HTTP tests"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-tests:
    name: test:mock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Run mock tests
        run: ./gradlew :integration-test:desktopTest --tests "dev.akexorcist.githubviewer.test.mock.*" --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mock-test-results
          path: integration-test/build/reports/tests/desktopTest/
          retention-days: 7

  real-http-tests:
    name: test:integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_real_tests != 'true')

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x gradlew

      - name: Run real HTTP integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: ./gradlew :integration-test:desktopTest --tests "dev.akexorcist.githubviewer.test.*IntegrationTest" --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: real-http-test-results
          path: integration-test/build/reports/tests/desktopTest/
          retention-days: 7
